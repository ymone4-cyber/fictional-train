<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐶 Surprise !</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.15);
        }

        .dog {
            font-size: 120px;
        }

        h1 {
            color: #222;
        }

        p {
            color: #666;
        }
    </style>
</head>

<body>

    <div class="box">
        <div class="dog">🐶</div>
        <h1>Surprise !</h1>
        <p>C'était une simulation de sensibilisation au phishing.</p>
        <p>Aucune donnée n'a été collectée.</p>
    </div>

</body>
</html>
